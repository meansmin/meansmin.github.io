name: 사이트 빌드 및 배포

on:
  # content/apps.json 이 원본이므로 push 될 때 반영하면 충분하다.
  push:
    branches: [main]
  # Actions 탭에서 버튼으로 다시 돌릴 수 있다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 2026-11-09: ubuntu-latest(Ubuntu 26 으로 이전 중)에서 빌드가 7초 만에 실패해 24.04 로 고정. 로컬·리눅스(Node 22) 빌드는 통과.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 데이터 검사
        # 문제가 있는 항목만 비공개 처리하고 빌드는 계속한다.
        run: npm run data

      - name: 빌드
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
